[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ternwire"
version = "0.2.0"
description = "Python client for the Ternwire transactional email API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ternwire", email = "support@ternwire.com" }]
keywords = ["email", "transactional-email", "ternwire", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://ternwire.com"
Documentation = "https://ternwire.com/docs"
Support = "https://ternwire.com/contact"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ternwire = ["py.typed"]
